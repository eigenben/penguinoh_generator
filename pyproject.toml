[project]
name = "penguinoh-generator"
version = "0.2.0"
description = "Generate images of Penguinoh with a FLUX.2 [klein] LoRA"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA.md"]
dependencies = [
    "accelerate>=1.10",
    "datasets>=3.0",
    "diffusers>=0.41.0",
    "huggingface-hub",
    "modal>=1.6",
    "peft>=0.17",
    "pillow",
    "torch>=2.8",
    "torchvision",
    "transformers>=4.57",
    "wandb",
]

[project.scripts]
penguinoh = "penguinoh.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "penguinoh"
module-root = ""
